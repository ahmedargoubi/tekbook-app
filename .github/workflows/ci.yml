name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile (package)
        run: mvn -B package -DskipTests

      - name: Lister le JAR produit
        run: ls -lh target/*.jar

  package-check:
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du JAR
        run: ls -lh target/*.jar
