name: CI - TekBook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build with Maven
        run: mvn -B -q -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: tekbook-jar
          path: target/*.jar

  # --- B2 : SAST avec --error (job rouge, gate actif) ---
  semgrep_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: |
          semgrep --version
          semgrep scan --config tekbook-rules.yml --error \
            --metrics=off --json --output semgrep-report.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
